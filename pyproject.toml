[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# PEP 8 errors/warnings, Pyflakes, and isort-compatible import ordering.
select = ["E4", "E7", "E9", "W", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["pogo_gbl_analyzer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = ["pogo_gbl_analyzer", "tests"]
# Unused legacy implementation has incompatible models; check the active app.
exclude = ['^pogo_gbl_analyzer/processing\.py$']
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
